  - 600.0
  - 800.0
  - 1000.0
  - 2000.0
  - 3000.0
  - 4000.0
  - 5000.0
  - 6000.0
  - 8000.0
  - 10000.0
  - 15000.0
  jobs_file: jobs.csv
  input_template: '{job}.inp'
run:
  command: rfluka -N0 -M1 {input}
  parser: fluka_usrtrack
  parser_options:
    files:
      totflux: '*fort.21'
      peakflux: '*fort.22'
  outputs:
  - '*fort.*'
  - '*.out'
  - '*.err'
  - '*.lis'
  copy_files: []
storage: local
harvest:
  download_outputs: true
analysis:
  type: attenuation
  intensity_column: peakflux_value
  i0:
    mode: blank
    sample: BLANK
  densities_g_cm3:
