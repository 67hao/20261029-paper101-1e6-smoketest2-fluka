  root_folder_id: 1TgchqXdtYBWHLqApuFLVe16Ote47zzal
github:
  repo: ''
subprojects:
- name: MAC
  samples:
  - BLANK
  - S1
  - S2
  - S3
  - S4
  - S5
  - S6
  - S7
  - S8
  thicknesses_cm:
